:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:Poppins,system-ui,-apple-system,sans-serif;color:var(--espresso);background:var(--foam);

input,select,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--caramel);outline-offset:2px}
.app{display:grid;grid-template-columns:96px 1fr;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 0}

.rail{background:var(--espresso);color:#F1E6D8;display:flex;flex-direction:column;align-items:center;overflow-y:auto;
  padding:12px 0 calc(12px + env(safe-area-inset-bottom));gap:4px;padding-left:env(safe-area-inset-left)}
.mark{width:50px;height:50px;flex:none;border-radius:14px;background:var(--roast);display:grid;place-items:center;
  font-weight:800;font-size:27px;color:#F3DFC6;margin-bottom:10px;letter-spacing:-1px}
.nav{width:80px;flex:none;padding:8px 0 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:12px;font-weight:500;color:#CDB9A5;position:relative}
.nav svg{width:25px;height:25px}
.nav[aria-current="page"]{background:#5A3424;color:#fff}
.nav .badge{position:absolute;top:3px;right:12px;min-width:20px;height:20px;border-radius:10px;background:var(--caramel);
  color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.nav .badge.bad{background:#D2493E}
.nav .lk{position:absolute;top:6px;right:16px;width:12px;height:12px;opacity:.7}
.rail .spacer{flex:1}
.rail .clock{font-size:12px;color:#A99280;text-align:center;line-height:1.3}
.lockbtn{font-size:12px;color:#F3DFC6;background:#5A3424;border-radius:10px;padding:6px 10px;margin-bottom:8px}

main{overflow:hidden;position:relative}
.view{height:100%;overflow:auto;padding:22px 26px calc(26px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.3px}
h2{font-size:18px;font-weight:600;margin:0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}

.seg{display:inline-flex;background:#EADFD2;border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:9px 16px;border-radius:9px;font-weight:500;font-size:14px;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--espresso);box-shadow:0 1px 2px rgba(59,33,22,.15)}

.btn{min-height:48px;padding:0 20px;border-radius:var(--r-md);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--roast);color:#fff}
.btn.primary:active{background:var(--espresso)}
.btn.ghost{background:#EADFD2}
.btn.line{border:1.5px solid var(--line);background:var(--paper)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)} .chip.plain{background:#EFE6DB;color:var(--muted)}

/* ORDER */
#v-order{padding:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 390px}
.menu-side{overflow:auto;padding:22px 22px calc(26px + env(safe-area-inset-bottom)) 26px}
.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);border:1.5px solid var(--line);
  border-radius:14px;padding:10px 14px;margin:-4px 0 6px;font-size:14px}
.strip.done{background:var(--okbg);border-color:#CDE6D5;color:var(--ok)}
.strip.closed{background:var(--warnbg);border-color:#F1DDB5;color:#6B4510}
.strip b{font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
.cat-title{font-size:15px;font-weight:600;color:var(--muted);margin:20px 0 10px}
.tile{position:relative;min-height:128px;border-radius:var(--r-lg);padding:16px 16px 14px 22px;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--sw)}
.t-coffee{background:var(--roast);color:#FBF3EA}
.t-milk{background:var(--paper);color:var(--espresso);box-shadow:inset 0 0 0 1.5px var(--line)}
.t-name{font-size:17px;font-weight:600;line-height:1.25}
.t-price{font-size:22px;font-weight:700;letter-spacing:-.3px}
.t-coffee .t-price{color:#F3D3AE} .t-milk .t-price{color:var(--roast)}
.tile .chip{margin-top:6px}
.tile.out{opacity:.62}
.t-qty{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:16px;background:var(--caramel);color:#fff;
  font-weight:700;display:grid;place-items:center;font-size:15px}
.t-coffee .t-qty{background:#F3D3AE;color:var(--espresso)}

.ticket-wrap{min-width:0;background:#EADFD2;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;min-height:0}
.ticket{min-width:0;background:var(--paper);flex:1;display:flex;flex-direction:column;min-height:0;position:relative;border-radius:14px 14px 0 0;
  box-shadow:0 2px 10px rgba(59,33,22,.08);margin-bottom:12px}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;
  background:linear-gradient(-45deg,transparent 8px,var(--paper) 0) 0 0/16px 12px,linear-gradient(45deg,transparent 8px,var(--paper) 0) 0 0/16px 12px;background-repeat:repeat-x}
.tk-head{padding:16px 20px 12px;border-bottom:1.5px dashed var(--line)}
.tk-num{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.tk-num small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.tk-name{margin-top:10px;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--foam)}
.tk-lines{flex:1;overflow:auto;padding:4px 20px;min-height:60px}
.tk-empty{color:var(--muted);text-align:center;padding:36px 10px;font-size:14px}
.tk-line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 0;border-bottom:1px solid #F0E8DE;align-items:center}
.tk-line .nm{font-weight:600}
.tk-line .each{font-size:13px;color:var(--muted)}
.tk-line .amt{font-weight:600;text-align:right}
.tk-line .opts{font-size:13px;color:var(--roast);font-weight:600;padding:6px 10px;border-radius:9px;background:var(--foam)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--foam);border-radius:10px}
.stepper button{width:40px;height:38px;font-size:20px;font-weight:600;color:var(--roast)}
.stepper span{min-width:24px;text-align:center;font-weight:700}
.tk-foot{padding:12px 20px 14px;border-top:1.5px dashed var(--line)}
.tk-total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tk-total b{font-size:30px;font-weight:800;letter-spacing:-.5px}
.pay{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.pay button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;font-size:14px}
.pay button[aria-pressed="true"]{border-color:var(--roast);background:var(--roast);color:#fff}
.cash{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.cash button{min-height:40px;border-radius:9px;background:var(--foam);font-weight:600;font-size:14px}
.cash button[aria-pressed="true"]{background:var(--latte);box-shadow:inset 0 0 0 1.5px var(--caramel)}
.cash-in{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:14px}
.cash-in input,.cash-in select{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--paper);min-height:42px}
.cash-in .chg{font-weight:700;white-space:nowrap}
.tk-actions{display:grid;grid-template-columns:auto 1fr;gap:8px}
.tk-actions .primary{font-size:17px;min-height:56px}

/* ORDERS */
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ocard{background:var(--paper);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--line)}
.ocard.preparing{border-color:var(--caramel);box-shadow:0 0 0 3px #F1E1CC}
.ocard.void{opacity:.55}
.ocard .num{font-size:24px;font-weight:800;letter-spacing:-.5px}
.ocard ul{margin:0;padding:0;list-style:none;font-size:15px}
.ocard li{padding:3px 0}
.ocard li b{font-weight:700;margin-right:6px;color:var(--roast)}
.ocard .meta{font-size:13px;color:var(--muted)}
.ocard .acts{display:flex;gap:8px;margin-top:auto}
.ocard .acts .primary{flex:1}
.empty{background:var(--paper);border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:40px;text-align:center;color:var(--muted)}
.shiftbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:16px}

/* Cards & tables */
.card{background:var(--paper);border-radius:var(--r-lg);border:1.5px solid var(--line);padding:18px 20px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:13px;font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid #F0E8DE;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{border-top:2px solid var(--espresso);font-weight:700}
.tbl .r{text-align:right}
.tbl .nm{font-weight:600}
.tbl .sub{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:#EFE6DB;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.bar.low i{background:#D49A3A} .bar.out i{background:#D2493E}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.daynav{display:flex;align-items:center;gap:6px}
.daynav>button{width:44px;height:44px;border-radius:12px;background:#EADFD2;font-size:20px;font-weight:600}
.daynav .lbl{min-width:200px;text-align:center;font-weight:600}
.ledger{font-size:16px}
.lrow{display:flex;justify-content:space-between;padding:6px 0;gap:10px}
.lrow.minus{color:var(--muted)}
.lrow .sub{font-size:13px;color:var(--muted);display:block}
.lrule{border-top:2px solid var(--espresso);margin:8px 0 4px}
.lrow.total{font-size:28px;font-weight:800;letter-spacing:-.5px;padding-top:4px;color:var(--espresso)}
.lrow.total.neg{color:var(--bad)}
.paysplit{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.paysplit div{background:var(--foam);border-radius:12px;padding:9px 11px}
.paysplit span{font-size:12.5px;color:var(--muted);display:block}
.paysplit b{font-size:17px}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.big small{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0}
.progress{position:relative;height:18px;background:#EFE6DB;border-radius:9px;overflow:visible;margin:16px 0 8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--roast),var(--caramel));border-radius:9px;min-width:4px;max-width:100%}
.progress .mk{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--espresso);border-radius:2px}
.progress .mkl{position:absolute;top:-26px;font-size:12px;font-weight:600;transform:translateX(-50%);white-space:nowrap}
.chart svg{width:100%;height:auto;display:block}
.form-row{display:grid;gap:8px;margin:12px 0}
.form-row select,.form-row input{border:1.5px solid var(--line);border-radius:10px;padding:0 10px;min-height:46px;background:var(--foam);min-width:0}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:20px;height:20px;min-height:0}
.xbtn{width:36px;height:36px;border-radius:10px;color:var(--muted);font-size:20px}
.banner{background:var(--warnbg);color:#6B4510;border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.splitbar{display:flex;height:34px;border-radius:10px;overflow:hidden;margin:14px 0 12px}
.splitbar i{display:block;height:100%}
.alloc{width:100%;border-collapse:collapse;font-size:15px}
.alloc td{padding:9px 0;border-bottom:1px solid #F0E8DE}
.alloc td:last-child{text-align:right;font-weight:600}
.alloc .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:10px;vertical-align:-1px}
.alloc .sub{font-size:12.5px;color:var(--muted);display:block;padding-left:22px}
.alloc tr.sep td{border-bottom:2px solid var(--espresso)}
.pct{width:64px;border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;text-align:right;background:var(--foam);min-height:34px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.fld input,.fld select{border:1.5px solid var(--line);border-radius:10px;padding:0 12px;min-height:46px;background:var(--foam);color:var(--espresso);font-size:15px;font-weight:400}
.fld.full{grid-column:1/-1}
.rline{display:grid;grid-template-columns:1fr 90px 40px 70px 36px;gap:8px;align-items:center;margin-bottom:8px}
.rline select,.rline input{border:1.5px solid var(--line);border-radius:10px;padding:0 10px;min-height:44px;background:var(--foam);min-width:0}
.rline .u{font-size:13px;color:var(--muted)} .rline .c{font-size:13px;text-align:right;color:var(--muted)}
.costbox{display:flex;gap:18px;background:var(--foam);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:14px}
.costbox b{display:block;font-size:18px}
.cap-row{display:grid;grid-template-columns:1fr 150px 36px;gap:8px;margin-bottom:8px}
.fx-row{display:grid;grid-template-columns:1fr 130px 170px 36px;gap:8px;margin-bottom:8px}
.cap-row input,.fx-row input,.fx-row select{border:1.5px solid var(--line);border-radius:10px;padding:0 12px;min-height:46px;background:var(--foam);min-width:0}
.data-actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.data-actions .card p{margin:6px 0 14px;font-size:14px;color:var(--muted)}
.data-actions .card .fld{margin-bottom:8px}
.optlist label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid #F0E8DE;font-size:16px}
.optlist input{width:24px;height:24px}

#modal{position:fixed;inset:0;background:rgba(40,22,14,.42);display:grid;place-items:center;z-index:50;padding:20px}
.sheet{background:var(--paper);border-radius:22px;width:min(620px,100%);max-height:calc(100dvh - 40px);overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(40,22,14,.3)}
.sheet.narrow{width:min(380px,100%)}
.sheet h2{margin-bottom:6px}
.sheet .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.sheet textarea{width:100%;height:180px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:12px;font-family:ui-monospace,monospace}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.pin-dots i{width:16px;height:16px;border-radius:8px;border:2px solid var(--roast)}
.pin-dots i.on{background:var(--roast)}
.pin-dots.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:62px;border-radius:14px;background:var(--foam);font-size:24px;font-weight:600}
.diff{font-size:20px;font-weight:700;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--espresso);color:#fff;
  padding:13px 22px;border-radius:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1050px){#v-order{grid-template-columns:minmax(0,1fr) 340px}.two{grid-template-columns:1fr}}
@media (max-width:900px){#v-order{grid-template-columns:minmax(0,1fr) 300px}.tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.paysplit{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{flex-direction:row;order:2;padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;overflow-x:auto}
  .mark,.rail .spacer,.rail .clock{display:none}
  .nav{width:auto;flex:1;min-width:56px}
  #v-order{grid-template-columns:1fr;grid-template-rows:1fr auto;overflow:auto}
  .form-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="mark" aria-hidden="true">H</div>
    <button class="nav" data-act="go" data-v="order"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1.3 12.1a1 1 0 0 1-1 .9H8.3a1 1 0 0 1-1-.9z"/><path d="M5 8h14M9 8l1-5h4"/></svg>Order</button>
    <button class="nav" data-act="go" data-v="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Orders<span class="badge" id="b-orders" hidden></span></button>
    <button class="nav" data-act="go" data-v="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>Stock<span class="badge bad" id="b-stock" hidden></span></button>
    <button class="nav" data-act="go" data-v="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 17V7h3.2a2.6 2.6 0 0 1 0 5.2H9.5M8 9.6h8M8 11.2h8"/></svg>Money</button>
    <button class="nav" data-act="go" data-v="allocate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Allocate</button>
    <button class="nav" data-act="go" data-v="payback"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Payback</button>
    <button class="nav" data-act="go" data-v="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Setup</button>
    <div class="spacer"></div>
    <button class="lockbtn" data-act="lock" id="lockbtn" hidden>Lock</button>
    <div class="clock" id="clock"></div>
  </nav>
  <main>
    <section class="view" id="v-order"></section>
    <section class="view" id="v-orders" hidden></section>
    <section class="view" id="v-stock" hidden></section>
    <section class="view" id="v-money" hidden></section>
    <section class="view" id="v-allocate" hidden></section>
    <section class="view" id="v-payback" hidden></section>
    <section class="view" id="v-setup" hidden></section>
  </main>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-in" accept=".json,application/json" hidden>

<script>
"use strict";
/* ================= helpers ================= */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);

  async set(v){

function drinkStatus(m,extra=0){let st='ok';
  for(const r of m.recipe){const s=sup(r.s);if(!s)continue;if(s.stock<r.q*(1+extra))return 'out';if(s.stock<=s.reorderAt)st='low'}return st}
function nextNum(){return state.orders.filter(o=>dayKey(o.ts)===today()).length+1}

// Day index, rebuilt when data changes
let _idx=null,_idxVer=-1;
function idx(){
  if(_idxVer===ver&&_idx)return _idx;
  const by=(arr,f=x=>dayKey(x.ts))=>{const m=new Map();for(const x of arr){const k=f(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)}return m};
  const orders=by(liveOrders()),work=new Set([...orders.keys(),...state.shifts.map(s=>s.day)]);
  const start=[...work].sort()[0]||null;
  _idx={orders,expenses:by(state.expenses),waste:by(state.waste),restocks:by(state.restocks),shifts:by(state.shifts,s=>s.day),work,start};
  _idxVer=ver;return _idx}
function fixedFor(k,assumeWork){
  const I=idx(),started=(I.start&&k>=I.start)||assumeWork,worked=assumeWork||I.work.has(k);
  let daily=0,spread=0;const items=[];
  if(!started)return {daily,spread,items};
  for(const f of state.fixed){const a=+f.amount||0;let v=0;
    if(f.per==='day'){if(worked)v=a;daily+=v}else{v=f.per==='week'?a/7:a*12/365;spread+=v}
    if(v)items.push({label:f.label,amount:v,per:f.per})}
  return {daily,spread,items}}
function dayStats(k,assumeWork){
  const I=idx(),os=I.orders.get(k)||[],ex=I.expenses.get(k)||[],ws=I.waste.get(k)||[],rs=(I.restocks.get(k)||[]);
  const paid=os.filter(o=>o.pay!=='free'),free=os.filter(o=>o.pay==='free');
  const sales=sum(paid.map(o=>o.total)),ingredients=sum(paid.map(o=>o.cost)),freeCost=sum(free.map(o=>o.cost)),wasteCost=sum(ws.map(w=>w.cost));
  const other=sum(ex.map(e=>e.amount)),fx=fixedFor(k,assumeWork);
  const pay={cash:0,gcash:0,maya:0};paid.forEach(o=>pay[o.pay]=(pay[o.pay]||0)+o.total);
  const per={};paid.forEach(o=>o.lines.forEach(l=>{const p=per[l.menuId]||(per[l.menuId]={name:l.base||l.name,qty:0,sales:0,cost:0});
    p.qty+=l.qty;p.sales+=l.price*l.qty;p.cost+=l.unitCost*l.qty}));
  const profit=sales-ingredients-freeCost-wasteCost-other-fx.daily-fx.spread;
  return {k,os,paid,free,ex,ws,sales,ingredients,freeCost,wasteCost,other,fixed:fx,staff:fx.daily,overhead:fx.spread,profit,pay,per,
    cups:sum(paid.flatMap(o=>o.lines.map(l=>l.qty))),refs:paid.filter(o=>o.pay!=='cash'),restockCash:sum(rs.filter(r=>r.drawer).map(r=>r.packs*r.price))}}
function rangeStats(keys){
  const ds=keys.map(k=>dayStats(k)),t={};
  for(const f of ['sales','ingredients','freeCost','wasteCost','other','staff','overhead','profit','cups'])t[f]=sum(ds.map(d=>d[f]));
  t.days=ds;t.workDays=ds.filter(d=>idx().work.has(d.k)).length;return t}
function daysFrom(a,b){const out=[];for(let k=a;k<=b;k=shiftKey(k,1))out.push(k);return out}
function totals(){
  const I=idx(),capital=sum(state.capital.map(c=>c.amount));
  const all=I.start?rangeStats(daysFrom(I.start,today())):rangeStats([]);
  const from=shiftKey(today(),-6),recent=[...I.work].filter(k=>k>=from);
  // fixed spread costs apply every calendar day, so weekly profit / selling days is the fair average
  const wk=I.start?rangeStats(daysFrom(I.start>from?I.start:from,today())):null;
  const avg=recent.length&&wk?wk.profit/recent.length:0;
  const deposited=sum(state.deposits.map(d=>d.amount));
  return {capital,profit:all.profit,sales:all.sales,avg,deposited,goal:capital*state.settings.evenPct/100}}
function usagePerDay(){
  const from=shiftKey(today(),-6),use={},days=new Set();
  for(const o of liveOrders()){const k=dayKey(o.ts);if(k<from)continue;days.add(k);for(const l of o.lines)for(const r of l.recipe)use[r.s]=(use[r.s]||0)+r.q*l.qty}
  for(const w of state.waste){if(dayKey(w.ts)<from)continue;for(const r of w.recipe)use[r.s]=(use[r.s]||0)+r.q}
  const n=Math.max(1,days.size);for(const k in use)use[k]/=n;return use}
function stockInfo(s,use){const perDay=use[s.id]||0,daysLeft=perDay>0?Math.max(0,s.stock)/perDay:null;
  let st='ok';if(s.stock<=0)st='out';else if(s.stock<=s.reorderAt||(daysLeft!==null&&daysLeft<2))st='low';return {perDay,daysLeft,st}}
function estCounts(){return {noPrice:state.supplies.filter(s=>!(s.packPrice>0)).length,menu:state.menu.filter(m=>m.est).length}}
const avgMargin=()=>{const ms=state.menu.filter(m=>m.active!==false);return ms.length?sum(ms.map(m=>m.price-drinkCost(m)))/ms.length:0};

  return {supplies:t.ingredients+t.freeCost+t.wasteCost,staff:t.staff,overhead:t.overhead,other:t.other,profit:t.profit,
    payback:left*sp.payback/100,emergency:left*sp.emergency/100,owners:left*sp.owners/100}}

function shiftCash(sh,until=Date.now()){
  const inWin=ts=>ts>=sh.openTs&&ts<=until;
  const cashSales=sum(liveOrders().filter(o=>o.pay==='cash'&&inWin(o.ts)).map(o=>o.total));
  const out=sum(state.expenses.filter(e=>e.drawer&&inWin(e.ts)).map(e=>e.amount))+sum(state.restocks.filter(r=>r.drawer&&inWin(r.ts)).map(r=>r.packs*r.price))
    +sum(state.deposits.filter(d=>d.from==='Cash drawer'&&inWin(d.ts)).map(d=>d.amount));
  return {cashSales,out,expected:sh.float+cashSales-out}}

  if(!sh)return `<div class="strip closed"><span>The shift isn't open yet. Open it with your starting cash before taking orders.</span><button class="btn primary sm" data-act="openshift">Open shift</button></div>`;
  const d=dayStats(today(),true),need=d.staff+d.overhead,earned=d.sales-d.ingredients-d.freeCost-d.wasteCost-d.other,remain=need-earned,m=avgMargin();
  if(remain<=0)return `<div class="strip done"><span>Today's staff pay and rent are covered. Every cup from here is profit.</span><span>✓</span></div>`;
  const cups=m>0?Math.ceil(remain/m):0;
  return `<div class="strip"><span><b>${cups} more cup${cups===1?'':'s'}</b> to cover today's staff pay and rent</span><span class="muted">Shift open since ${fmtTime(sh.openTs)}</span></div>`}

function barsSVG(vals,labels,{h=140,color='#6B3A22',hi=-1,fmt=peso}={}){
  const n=vals.length,W=560,max=Math.max(1,...vals.map(Math.abs)),neg=vals.some(v=>v<0),mid=neg?h/2:h-4,sc=(mid-6)/max,bw=W/n;
  return `<svg viewBox="0 0 ${W} ${h+18}" role="img"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="#E2D7CA"/>
  ${vals.map((v,i)=>{const hh=Math.abs(v)*sc;return `<rect x="${i*bw+bw*.18}" y="${v>=0?mid-hh:mid}" width="${bw*.64}" height="${v?Math.max(2,hh):0}" rx="3" fill="${v<0?'#D2493E':i===hi?'#B9814E':color}"><title>${labels[i]}: ${fmt(v)}</title></rect>`}).join('')}
  ${labels.map((l,i)=>l?`<text x="${i*bw+bw/2}" y="${h+14}" font-size="11" text-anchor="middle" fill="#7D6A5C">${l}</text>`:'').join('')}</svg>`}

/* ================= export / import / cloud ================= */
async function shareOrDownload(name,text,type){
  const file=new File([text],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return 'shared'}}catch(e){if(e&&e.name==='AbortError')return 'cancelled'}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){}
  openModal(`<h2>${esc(name)}</h2><p class="muted" style="margin:0 0 10px">If no file appeared, copy this text and save it as <b>${esc(name)}</b>.</p>
    <textarea readonly id="copy-text">${esc(text)}</textarea><div class="acts"><button class="btn ghost" data-act="close">Done</button><button class="btn primary" data-act="copy">Copy text</button></div>`);
  return 'downloaded'}
const backupJSON=()=>JSON.stringify({app:'haraya-pos',exported:new Date().toISOString(),state});
async function exportBackup(){const r=await shareOrDownload(`haraya-backup-${today()}.json`,backupJSON(),'application/json');
  if(r!=='cancelled'){state.lastBackup=Date.now();save();if(r==='shared')toast('Backup saved.');if(r==='shared')render()}}
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function exportCSV(k){let rows;
  if(k==='sales'){rows=[['Date','Time','Order #','Customer','Item','Qty','Price','Line total','Ingredient cost','Payment','Reference','Free reason','Status']];
    state.orders.forEach(o=>o.lines.forEach(l=>rows.push([dayKey(o.ts),fmtTime(o.ts),o.num,o.name,l.name,l.qty,l.price,o.pay==='free'?0:l.price*l.qty,(l.unitCost*l.qty).toFixed(2),PAY[o.pay],o.ref||'',o.reason||'',o.status])))}
  else if(k==='costs'){rows=[['Date','Time','Type','Detail','Amount','From drawer']];
    state.expenses.forEach(e=>rows.push([dayKey(e.ts),fmtTime(e.ts),'Expense: '+e.cat,e.note,e.amount,e.drawer?'yes':'no']));
    state.restocks.forEach(r=>{const s=sup(r.s);rows.push([dayKey(r.ts),fmtTime(r.ts),'Restock',(s?s.name:r.s)+' x'+r.packs,r.packs*r.price,r.drawer?'yes':'no'])});
    state.waste.forEach(w=>rows.push([dayKey(w.ts),fmtTime(w.ts),'Waste: '+w.reason,w.label,w.cost.toFixed(2),'']))}
  else if(k==='shifts'){rows=[['Date','Opened','Closed','Starting cash','Cash sales','Paid out','Expected','Counted','Difference']];
    state.shifts.forEach(s=>rows.push([s.day,fmtTime(s.openTs),s.closeTs?fmtTime(s.closeTs):'',s.float,s.cashSales??'',s.out??'',s.expected??'',s.counted??'',s.closeTs?(s.counted-s.expected).toFixed(2):'']))}
  else{rows=[['Date','Amount','From','Note']];state.deposits.forEach(d=>rows.push([dayKey(d.ts),d.amount,d.from,d.note]))}
  shareOrDownload(`haraya-${k}-${today()}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv')}
const validState=s=>s&&Array.isArray(s.supplies)&&Array.isArray(s.menu)&&Array.isArray(s.orders)&&Array.isArray(s.expenses);
async function sendCloud(manual){
  const c=state.cloud;if(!c.url){if(manual)toast('Add the backup address first.');return}
  if(!navigator.onLine){if(manual)toast('No internet right now. It will send when you\'re back online.');return}
  try{await fetch(c.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:c.key,backup:JSON.parse(backupJSON())})});
    c.lastSent=Date.now();dirtySinceCloud=false;store.set(JSON.parse(JSON.stringify(state)));if(manual){toast('Backup sent to Google Drive.');render()}}
  catch(e){if(manual)toast('Couldn\'t reach the backup address. Check it and try again.')}}
async function loadCloud(){const c=state.cloud;
  try{const r=await fetch(c.url+(c.url.includes('?')?'&':'?')+'key='+encodeURIComponent(c.key));const data=await r.json();const s=data.state||data;if(!validState(s))throw 0;
    confirmBox('Load the latest cloud backup?',`It has ${s.orders.length} orders and was made ${esc(new Date(data.exported).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'}))}. It replaces everything on this device.`,'Load backup',()=>{state=migrate(s);save();toast('Cloud backup loaded.');render()})}
  catch(e){toast('Couldn\'t load from the cloud. Check the address, key and internet.')}}

function addDemo(){
  if(!state.demoStock)state.demoStock=Object.fromEntries(state.supplies.map(s=>[s.id,s.stock]));
  const weights={spanish:5,caramel:4,vanillalatte:3,mocha:3,seasaltlatte:3,cookielatte:2,biscoffmilk:3,oreomilk:3,nutellamilk:2,strawmilk:2,bluemilk:1};
  const pool=Object.entries(weights).flatMap(([id,w])=>item(id)?Array(w).fill(id):[]),names=['','','','Ana','Jojo','Mika','Paolo','Bea','Carlo','Rina','Tess','Migs'];
  const peak=[0,1,2,2,3,3,3,4,4,5,6,7,7,8,8,9,9,10,10,11,11];
  for(let d=9;d>=0;d--){
    if(d===4||d===8)continue; // closed days
    const dk=shiftKey(today(),-d),base=keyToDate(dk),n=d===0?10:18+Math.floor(Math.random()*16);
    const open=new Date(base);open.setHours(7,50);if(d===0&&open>Date.now())open.setTime(Date.now()-3*3600e3);
    const sh={id:uid(),day:dk,openTs:open.getTime(),float:1000,closeTs:null,demo:true};state.shifts.push(sh);
    let num=0;
    for(let i=0;i<n;i++){const ts=new Date(base);ts.setHours(8+peak[Math.floor(Math.random()*peak.length)],Math.floor(Math.random()*60));
      if(d===0)ts.setTime(Math.min(ts.getTime(),Date.now()-(n-i)*120000));if(ts.getTime()<sh.openTs)ts.setTime(sh.openTs+60000*(i+1));
      const lines=[];const cnt=Math.random()<.7?1:2;
      for(let j=0;j<cnt;j++){const m=item(pool[Math.floor(Math.random()*pool.length)]),ads=Math.random()<.15&&addon('shot')?['shot']:[];
        const l={id:m.id,qty:1,addons:ads},ex=lines.find(x=>x.key===lineKey(m.id,ads));if(ex){ex.qty++;continue}
        lines.push({key:lineKey(m.id,ads),menuId:m.id,base:m.name,name:lineName(l),price:linePrice(l),qty:1,unitCost:recipeCost(lineRecipe(l)),recipe:lineRecipe(l),addons:ads})}
      const free=Math.random()<.04,rp=Math.random(),pay=free?'free':rp<.6?'cash':rp<.9?'gcash':'maya';
      const total=free?0:sum(lines.map(l=>l.price*l.qty));
      state.orders.push({id:uid(),num:++num,ts:ts.getTime(),name:names[Math.floor(Math.random()*names.length)],lines,total,cost:sum(lines.map(l=>l.unitCost*l.qty)),
        pay,ref:pay==='gcash'||pay==='maya'?String(1000+Math.floor(Math.random()*9000)):'',reason:free?'Staff drink':'',tendered:total,status:d===0&&i>=n-3?'preparing':'done',demo:true})}
    const et=new Date(base);et.setHours(9);state.expenses.push({id:uid(),ts:Math.min(et.getTime(),Date.now()-3600e3),cat:'Ice',note:'2 bags',amount:120,drawer:true,demo:true});
    if(d%3===0)state.expenses.push({id:uid(),ts:Math.min(et.getTime()+60000,Date.now()-3500e3),cat:'Gas / transport',note:'',amount:200,drawer:true,demo:true});
    if(d===6)state.waste.push({id:uid(),ts:et.getTime(),label:'Fresh milk 500 ml',reason:'Expired / spoiled',recipe:[{s:'milk',q:500}],cost:49,demo:true});
    if(d>0){const c=new Date(base);c.setHours(20,5);const cs=shiftCash(sh,c.getTime());const off=[0,0,0,-20,0,50][d%6];
      Object.assign(sh,{closeTs:c.getTime(),cashSales:cs.cashSales,out:cs.out,expected:cs.expected,counted:cs.expected+off})}
  }
  state.deposits.push({id:uid(),ts:keyToDate(shiftKey(today(),-3)).getTime(),amount:3000,from:'GCash',note:'Sample deposit',week:weekStart(shiftKey(today(),-3)),demo:true});
  state.orders.sort((a,b)=>a.ts-b.ts);ver++;
  const use=usagePerDay();state.supplies.forEach((s,i)=>{if(use[s.id])s.stock=Math.round(use[s.id]*(i%5===1?1.2:2+((i*7)%11)))});
  save()}

  csv:d=>exportCSV(d.k),
  copy:async()=>{const t=$('#copy-text');try{await navigator.clipboard.writeText(t.value);toast('Copied.')}catch(e){t.select();toast('Select all and copy.')}},
  import:()=>$('#file-in').click(),
  cloudsave:()=>{state.cloud.url=$('#cl-url').value.trim();state.cloud.key=$('#cl-key').value.trim();save();toast('Cloud backup settings saved.');render()},
  cloudsend:()=>sendCloud(true),
  cloudload:()=>loadCloud(),
  demo:()=>{addDemo();toast('Added sample sales.');ui.view='money';render()},
  cleardemo:()=>{clearDemo();toast('Sample sales removed.');render()},
  wipe:()=>confirmBox('Delete all sales data?','All orders, shifts, expenses, waste, restocks and deposits are deleted. Back up first if you might want them.','Delete everything',()=>{
    for(const k of ['orders','expenses','restocks','shifts','waste','deposits'])state[k]=[];save();toast('Sales data deleted.');render()},true),
};
document.addEventListener('click',e=>{
  if(state&&state.pin&&ownerOK())ui.ownerUntil=Date.now()+10*60e3;
  if(e.target.id==='modal'){pinCb=null;closeModal();return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=acts[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b)}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='tk-name')cart.name=t.value;
  else if(t.id==='ref-in')cart.ref=t.value;
  else if(t.id==='tend-in'){cart.tendered=t.value===''?null:+t.value;const total=cartTotal();
    $('#chg').textContent=cart.tendered===null?'':cart.tendered>=total?'Change '+peso(cart.tendered-total):'Short '+peso(total-cart.tendered);$$('.cash button').forEach(b=>b.setAttribute('aria-pressed','false'))}
  else if(t.closest('#rlines')||t.id==='d-price')updCost();
  else if(t.dataset.cap){const c=state.capital.find(x=>x.id===t.dataset.cap);c[t.dataset.k]=t.dataset.k==='amount'?(+t.value||0):t.value;save()}
  else if(t.dataset.fx){const f=state.fixed.find(x=>x.id===t.dataset.fx);f[t.dataset.k]=t.dataset.k==='amount'?(+t.value||0):t.value;save()}
  else if(t.dataset.split){state.settings.split[t.dataset.split]=Math.max(0,+t.value||0);save()}
  else if(t.dataset.set==='evenPct'){state.settings.evenPct=Math.min(100,Math.max(1,+t.value||50));save()}
  else if(t.id==='c-units')$('#c-packs').value=((+t.value||0)/(draft.packSize||1)).toFixed(2);
  else if(t.id==='c-packs')$('#c-units').value=Math.round((+t.value||0)*draft.packSize*10)/10;
  else if(t.id==='sh-count'){const df=(+t.value||0)-draft.c.expected;$('#sh-diff').innerHTML=t.value===''?'':Math.abs(df)<1?'<span style="color:var(--ok)">Matches</span>':`<span style="color:${df<0?'var(--bad)':'var(--warn)'}">${df<0?'Short by ':'Over by '}${peso(Math.abs(df))}</span>`}});
document.addEventListener('change',e=>{const t=e.target;if(t.closest('#rlines'))updCost();if(t.id==='reason-in')cart.reason=t.value;
  if(t.dataset.cap||t.dataset.fx||t.dataset.split||t.dataset.set)render()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.dataset.form==='expense'){const amt=+f.amt.value;if(!(amt>0))return;const k=ui.moneyDay||today(),ts=k===today()?Date.now():keyToDate(k).getTime();
    state.expenses.push({id:uid(),ts,cat:f.cat.value,note:f.note.value.trim(),amount:amt,drawer:f.drawer.checked});save();toast(`${f.cat.value} ${peso(amt)} added.`);render()}
  if(f.dataset.form==='deposit'){const amt=+f.amt.value;if(!(amt>0))return;addDeposit(amt,f.from.value,f.note.value.trim());toast(`${peso(amt)} deposited.`);render()}});
document.addEventListener('keydown',e=>{if($('#modal').hidden)return;if(e.key==='Escape'){pinCb=null;closeModal()}
  else if($('#pdots')&&/^[0-9]$/.test(e.key))pinPress(e.key);else if($('#pdots')&&e.key==='Backspace')pinPress('del')});
$('#file-in').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const data=JSON.parse(await f.text()),s=data.state||data;if(!validState(s))throw 0;
    confirmBox('Restore this backup?',`It has ${s.orders.length} orders${data.exported?' and was made '+esc(new Date(data.exported).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'})):''}. It replaces everything on this device.`,'Restore backup',()=>{
      state=migrate(s);save();toast('Backup restored.');render()})}catch(err){toast('That file isn\'t a Haraya backup.')}});
window.addEventListener('online',()=>{if(state&&state.cloud.url&&dirtySinceCloud)sendCloud()});

/* ================= boot ================= */
function tick(){$('#clock').innerHTML=new Date().toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})+'<br>'+new Date().toLocaleDateString('en-PH',{month:'short',day:'numeric'});
  if(state&&state.pin&&LOCKED_VIEWS.includes(ui.view)&&!ownerOK()&&$('#modal').hidden){ui.view='order';render();toast('Locked after 10 minutes.')}
  if(state&&state.cloud.url&&dirtySinceCloud&&navigator.onLine&&(!state.cloud.lastSent||Date.now()-state.cloud.lastSent>30*60e3))sendCloud()}
(async()=>{
  await store.open();const saved=await store.get();
  state=validState(saved)?migrate(saved):defaults();save();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  tick();setInterval(tick,30000);render();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
})();
</script>
</body>
</html>
